# ============================================================
# OpenClash 完整配置（对标 Surge 规则体系）
# ============================================================

# ---------- 基础设置 ----------
mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false

# ---------- DNS 设置 ----------
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    - "*.srv.nintendo.net"
    - "*.stun.playstation.net"
    - "*.xboxlive.com"
    - "*.windowsupdate.com"
    - "*.windows.com"
    - "*.microsoft.com"
    - "*.live.com"
    - "*.office.com"
    - "*.office.net"
    - "*.outlook.com"
    - "*.apple.com"
    - "*.icloud.com"
    - "*.icloud-content.com"
    - "*.me.com"
    - "*.alipay.com"
    - "*.taobao.com"
    - "*.tmall.com"
    - "*.jd.com"
    - "*.qq.com"
    - "*.weixin.com"
    - "*.bilibili.com"
    - "*.163.com"
    - "*.126.net"
    - "*.127.net"
    - rule-set:oc-cn-domain
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - https://dns.alidns.com/dns-query
  fallback:
    - tls://1.1.1.1
    - tls://8.8.4.4
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/8
      - 127.0.0.0/8
      - 169.254.0.0/16
      - 224.0.0.0/4

# ---------- 规则提供者 ----------
rule-providers:
  # 1. 你的自定义规则（从 rules.txt 拉取）
  my_github_rules:
    type: http
    behavior: domain
    format: text
    url: "https://raw.githubusercontent.com/399294508/my-openclash-rules/main/rules.txt"
    path: ./ruleset/my_github_rules.txt
