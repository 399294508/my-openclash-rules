# ============================================================
# 策略组定义（通配符已修正）
# ============================================================
proxy-groups:
  # 主策略组
  - name: "🚀 节点选择"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🇭🇰 香港节点"
      - "🇨🇳 台湾节点"
      - "🇸🇬 狮城节点"
      - "🇯🇵 日本节点"
      - "🇺🇲 美国节点"
      - "🇰🇷 韩国节点"
      - "🚀 手动切换"
      - DIRECT

  - name: "🚀 手动切换"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🇭🇰 香港节点"
      - "🇨🇳 台湾节点"
      - "🇸🇬 狮城节点"
      - "🇯🇵 日本节点"
      - "🇺🇲 美国节点"
      - "🇰🇷 韩国节点"
      - DIRECT

  - name: "♻️ 自动选择"
    type: url-test
    proxies:
      - "*香港*"
      - "*HK*"
      - "*美国*"
      - "*US*"
      - "*日本*"
      - "*JP*"
      - "*新加坡*"
      - "*SG*"
      - "*台湾*"
      - "*TW*"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "🎯 全球直连"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"

  - name: "🐟 漏网之鱼"
    type: select
    proxies:
      - "🚀 节点选择"
      - DIRECT

  # 地区节点组
  - name: "🇭🇰 香港节点"
    type: url-test
    proxies:
      - "*香港*"
      - "*HK*"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "🇨🇳 台湾节点"
    type: url-test
    proxies:
      - "*台湾*"
      - "*TW*"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "🇸🇬 狮城节点"
    type: url-test
    proxies:
      - "*新加坡*"
      - "*SG*"
      - "*狮城*"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "🇯🇵 日本节点"
    type: url-test
    proxies:
      - "*日本*"
      - "*JP*"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "🇺🇲 美国节点"
    type: url-test
    proxies:
      - "*美国*"
      - "*US*"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 150

  - name: "🇰🇷 韩国节点"
    type: url-test
    proxies:
      - "*韩国*"
      - "*KR*"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # 功能策略组
  - name: "🛑 广告拦截"
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: "🍃 应用净化"
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: "📢 谷歌FCM"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"

  - name: "Ⓜ️ 微软Bing"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"

  - name: "Ⓜ️ 微软云盘"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"

  - name: "Ⓜ️ 微软服务"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"

  - name: "🍎 苹果服务"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"

  - name: "📲 电报消息"
    type: select
    proxies:
      - "🚀 节点选择"
      - DIRECT

  - name: "💬 Ai平台"
    type: select
    proxies:
      - "🚀 节点选择"
      - DIRECT

  - name: "🎶 网易音乐"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"

  - name: "🎮 游戏平台"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"

  - name: "📹 油管视频"
    type: select
    proxies:
      - "🚀 节点选择"
      - DIRECT

  - name: "🎥 奈飞视频"
    type: select
    proxies:
      - "🚀 节点选择"
      - DIRECT

  - name: "📺 巴哈姆特"
    type: select
    proxies:
      - "🇨🇳 台湾节点"
      - "🚀 节点选择"
      - DIRECT

  - name: "📺 哔哩哔哩"
    type: select
    proxies:
      - "🎯 全球直连"
      - "🇨🇳 台湾节点"
      - "🇭🇰 香港节点"

  - name: "🌍 国外媒体"
    type: select
    proxies:
      - "🚀 节点选择"
      - DIRECT

  - name: "🌏 国内媒体"
    type: select
    proxies:
      - DIRECT
      - "🇭🇰 香港节点"

# ---------- 规则定义（规则执行顺序从上到下） ----------
rules:
  # 1. 自定义规则（优先级最高）
  - RULE-SET,my_github_rules,PROXY

  # 2. 局域网/直连
  - RULE-SET,LocalAreaNetwork,"🎯 全球直连"
  - RULE-SET,UnBan,"🎯 全球直连"

  # 3. 广告拦截
  - RULE-SET,BanAD,"🛑 广告拦截"
  - RULE-SET,BanProgramAD,"🍃 应用净化"

  # 4. Google 服务
  - RULE-SET,GoogleFCM,"📢 谷歌FCM"
  - RULE-SET,GoogleCN,"🎯 全球直连"

  # 5. 微软服务
  - RULE-SET,Bing,"Ⓜ️ 微软Bing"
  - RULE-SET,OneDrive,"Ⓜ️ 微软云盘"
  - RULE-SET,Microsoft,"Ⓜ️ 微软服务"

  # 6. Apple 服务
  - RULE-SET,Apple,"🍎 苹果服务"

  # 7. 电报/AI
  - RULE-SET,Telegram,"📲 电报消息"
  - RULE-SET,AI,"💬 Ai平台"
  - RULE-SET,OpenAi,"💬 Ai平台"

  # 8. 音乐/游戏
  - RULE-SET,NetEaseMusic,"🎶 网易音乐"
